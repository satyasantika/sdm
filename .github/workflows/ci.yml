name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-sdm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: db_sdm_testing
      DB_USERNAME: root
      DB_PASSWORD: root
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: db_sdm_testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5.11"
          extensions: mbstring, intl, pdo_mysql, zip, gd, bcmath
          coverage: none
          ini-values: opcache.jit=disable, opcache.enable_cli=0

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-${{ hashFiles('package-lock.json') }}
          restore-keys: node-

      - run: npm ci
      - run: npm run build

      - run: cp .env.example .env
      - run: sed -i "s|^APP_URL=.*|APP_URL=http://localhost|" .env
      - run: php artisan key:generate

      - run: ./vendor/bin/pint --test
      - run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - run: php artisan test

      - name: Optimasi produksi (memastikan config/route cache tidak gagal)
        run: composer produksi

  deploy:
    needs: uji
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-sdm
      cancel-in-progress: false
    steps:
      - name: Deploy ke server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          script_stop: true
          script: |
            ~/docker-apps/deploy.sh sdm
