server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Hanya untuk impor Excel; tidak ada unggahan berkas lain (BR-24).
    client_max_body_size 6M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    server_tokens off;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # berkas tersembunyi (.env, .git, dll.) tidak pernah dilayani
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120;
    }
}
