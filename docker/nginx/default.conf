# Aplikasi dilayani di akar (/) dan di bawah awalan /sdm (https://supportfkip.unsil.ac.id/sdm).
# Reverse proxy kampus HARUS meneruskan jalur apa adanya (proxy_pass tanpa memotong /sdm).
# Untuk jalur berawalan /sdm, awalan dipotong dari REQUEST_URI dan dikirim sebagai X-Forwarded-Prefix, yang dipercaya
# Laravel (TRUSTED_PROXIES) sehingga seluruh URL dibangun dengan /sdm dan cache rute tetap berfungsi.
# Pengecualian: Horizon (JavaScript-nya memakai base path sendiri) dilayani sebagai jalur penuh /sdm/horizon (HORIZON_PATH=sdm/horizon).
map $request_uri $uri_aplikasi {
    default                          $request_uri;
    ~^/sdm/horizon(?:/|\?|$)         $request_uri;
    ~^/sdm(?<sisa>/.*)$              $sisa;
}

map $request_uri $awalan_aplikasi {
    default                          $http_x_forwarded_prefix;
    ~^/sdm/horizon(?:/|\?|$)         "";
    ~^/sdm(?:/|\?|$)                 /sdm;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.html index.php;

    # Hanya untuk impor Excel; tidak ada unggahan berkas lain (BR-24).
    client_max_body_size 6M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    location = /sdm {
        return 301 /sdm/$is_args$args;
    }

    location /sdm/ {
        rewrite ^/sdm/(.*)$ /$1 last;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # berkas tersembunyi (.env, .git, dll.) tidak pernah dilayani
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param REQUEST_URI $uri_aplikasi;
        fastcgi_param HTTP_X_FORWARDED_PREFIX $awalan_aplikasi;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120;
    }
}
