# Stack produksi SDM FKIP (F10.3). Semua rahasia dari .env (env_file); tidak ada nilai rahasia di berkas ini.
# Jalankan: docker compose -f compose.production.yaml up -d --build

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: app
    args:
      ASSET_URL: ${ASSET_URL:-https://supportfkip.unsil.ac.id/sdm}
  image: sdm-fkip/app:${APP_VERSION:-latest}
  env_file: .env
  environment: &app-env
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    REDIS_HOST: redis
    # nginx (jaringan docker) dipercaya agar X-Forwarded-Proto/-Prefix dari reverse proxy kampus dihormati
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
    healthcheck:
      # memanggil /api/health langsung ke PHP-FPM lewat FastCGI
      test:
        - CMD-SHELL
        - >-
          SCRIPT_NAME=/index.php SCRIPT_FILENAME=/var/www/html/public/index.php REQUEST_METHOD=GET
          REQUEST_URI=/api/health QUERY_STRING= cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q '"status":"ok"'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        ASSET_URL: ${ASSET_URL:-https://supportfkip.unsil.ac.id/sdm}
    image: sdm-fkip/web:${APP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy

  queue:
    <<: *app
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 60s
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?isi DB_ROOT_PASSWORD di .env}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  storage:
  mysql:
  redis:
