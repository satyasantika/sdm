# Stack produksi SDM FKIP (F10.3), Profil Ringan: STANDAR-TEKNIS §1b dan §7. Semua rahasia dari .env (env_file); tidak ada nilai rahasia di berkas ini.
# Jalankan: docker compose -f compose.production.yaml up -d --build
# MariaDB berjalan NATIVE di host (DB_HOST=host.docker.internal). Compose ini TIDAK memuat container database,
# Redis, atau Horizon/queue; antrean, cache, dan sesi memakai database, worker dinyalakan penjadwal (routes/console.php).

# Log Docker dirotasi (STANDAR-TEKNIS §7.1).
x-log: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: app
    args:
      ASSET_URL: ${ASSET_URL:-https://supportfkip.unsil.ac.id/sdm}
  image: sdm-fkip/app:${APP_VERSION:-latest}
  env_file: .env
  environment: &app-env
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: mariadb
    DB_HOST: host.docker.internal
    DB_PORT: "3306"
    # nginx (jaringan docker) dipercaya agar X-Forwarded-Proto/-Prefix dari reverse proxy kampus dihormati
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
    CACHE_STORE: database
    SESSION_DRIVER: database
    QUEUE_CONNECTION: database
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  logging: *log
  volumes:
    - storage:/var/www/html/storage

services:
  php:
    <<: *app
    # Batas memori: nilai awal (perkiraan); wajib dibuktikan dengan `docker stats` (STANDAR-TEKNIS §7.1).
    mem_limit: 512m
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
    healthcheck:
      # memanggil /api/health langsung ke PHP-FPM lewat FastCGI (503 hanya bila DB gagal)
      test:
        - CMD-SHELL
        - >-
          SCRIPT_NAME=/index.php SCRIPT_FILENAME=/var/www/html/public/index.php REQUEST_METHOD=GET
          REQUEST_URI=/api/health QUERY_STRING= cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q '"status":"ok"'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        ASSET_URL: ${ASSET_URL:-https://supportfkip.unsil.ac.id/sdm}
    image: sdm-fkip/web:${APP_VERSION:-latest}
    restart: unless-stopped
    mem_limit: 64m
    logging: *log
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      php:
        condition: service_healthy

  # Penjadwal sekaligus pemicu worker antrean (routes/console.php: queue:work tiap menit, --stop-when-empty).
  # Worker berjalan sebagai subproses di container ini: batas memori mencakup worker default dan worker berat (--memory=512).
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    mem_limit: 768m
    stop_grace_period: 60s
    depends_on:
      php:
        condition: service_healthy

volumes:
  storage:
    external: true
    name: docker-apps_sdm-storage
